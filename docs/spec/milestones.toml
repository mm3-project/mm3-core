# Core spec 0.23 (4 Nov 2026, start of development): CORE-314 (REST requests:
#   {payload}, error replies as 200, 504 timeout) and CORE-315 (GET /modules
#   entries, idempotent controls, 404 for unknown instances and pages) added;
#   CORE-112 (log-level API) and CORE-298 (CORE_API_REQUEST_TIMEOUT) changed.
# Core spec 0.24 (4 Nov 2026, start of part B): CORE-316 (log filters),
