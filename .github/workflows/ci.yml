name: CI

# Implements CORE-170 (Core spec 0.6, §10.9 Dependency management)
# Implements CORE-72 (Core spec 0.6, §10.3 Documentation and quality)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # merge base for the stale-citation check (CORE-77)
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      # Implements CORE-171 (Core spec 0.6, §10.9 Dependency management)
      - name: Lockfile matches pyproject (CORE-171)
        run: uv lock --check
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # Implements CORE-41, CORE-42 (Core spec 0.15, §8.4 Quality gate)
      # Implements CORE-263 (Core spec 0.15, §8.5 Catalogs at run time)
      - name: Catalogs compiled and complete (CORE-41, CORE-42, CORE-263)
        run: uv run mm3 i18n check
      # Implements CORE-75, CORE-76 (Core spec 0.6, §10.3 Documentation and quality)
      - name: Spec sync up to date (CORE-75, CORE-76)
        run: uv run python tools/spec_sync.py --check
      # Implements CORE-74, CORE-77 (Core spec 0.6, §10.3 Documentation and quality)
      - name: Spec references (CORE-74, CORE-77)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            uv run python tools/check_spec_refs.py --base "origin/${{ github.base_ref }}"
          else
            uv run python tools/check_spec_refs.py
          fi
      # Implements CORE-78 (Core spec 0.6, §10.3 Documentation and quality)
      - name: Coverage matrix (CORE-78)
        run: uv run python tools/trace_report.py --out coverage.md && cat coverage.md >> "$GITHUB_STEP_SUMMARY"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --all-extras
      # Browser tests (marker "browser") need Chromium; one job runs them, the
      # others skip them. Includes the shell smoke test: a module renders in
      # five languages and follows the grid when the window resizes.
      - name: Chromium for the browser tests
        if: matrix.python-version == '3.13'
        run: uv run playwright install --with-deps chromium
      # Deprecation warnings fail the suite (CORE-175), see pyproject.toml.
      - run: uv run pytest

  # Implements CORE-289 (Core spec 0.19, §9.4 Reference modules)
  modules:
    name: Reference module ${{ matrix.module }} (CORE-289)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [mm3-greeting, mm3-clock, mm3-weather]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen --all-extras
      - run: uv run playwright install --with-deps chromium
      # mm3-build is not on an index yet: the module's build resolves it from this wheel.
      - run: uv build --package mm3-build --wheel --out-dir "$RUNNER_TEMP/links"
      - name: mm3 module check (CORE-174, CORE-281)
        env:
          UV_FIND_LINKS: ${{ runner.temp }}/links
        run: uv run mm3 module check "modules/${{ matrix.module }}" --junit "$RUNNER_TEMP/check.xml"
      - name: Module tests (mm3-core[testing])
        run: uv run pytest "modules/${{ matrix.module }}/tests" --no-cov -o addopts=""

  # Implements CORE-174 (Core spec 0.6, §10.9 Dependency management)
  audit:
    name: pip-audit (CORE-174)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Workspace members (mm3-core, mm3-build) are built here, not downloaded.
      - run: uv export --frozen --all-extras --no-emit-workspace --format requirements-txt -o requirements.lock.txt
      # Every ignored advisory is listed in .pip-audit-ignore with its reason.
      - run: |
          args=$(awk '!/^#/ && NF {print "--ignore-vuln " $1}' .pip-audit-ignore)
          uvx pip-audit -r requirements.lock.txt --disable-pip --require-hashes --strict $args

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, audit]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Implements CORE-280 (Core spec 0.17, §10.2 Packaging and deployment):
      # mm3-build is built with the engine; the core wheel compiles its
      # catalogs with the mm3-i18n hook.
      - run: uv build --all-packages
      # Implements CORE-294 (Core spec 0.20, §10.2 Packaging and deployment):
      # the published default modules and mm3-modules-default are built with the
      # engine; their build resolves mm3-build from dist/.
      - name: Default modules and mm3-modules-default (CORE-294)
        run: |
          for m in mm3-clock mm3-weather mm3-modules-default; do
            uv build "modules/$m" --out-dir dist --find-links dist
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Implements CORE-293 (Core spec 0.20, §10.2 Packaging and deployment): the
  # installer runs on clean Debian 12 and 13 images with the wheels built above.
  install:
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        debian: ["12", "13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install on a clean Debian ${{ matrix.debian }}
        run: >
          docker run --rm -e DEBIAN_VERSION=${{ matrix.debian }}
          -v "$PWD:/src:ro" debian:${{ matrix.debian }}
          bash -c 'apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates python3 python3-venv && bash /src/install/ci-check.sh'
      - name: An unsupported system is refused with exit code 1
        run: >
          docker run --rm -v "$PWD:/src:ro" ubuntu:24.04
          bash -c 'bash /src/install/mm3-install.sh; test $? -eq 1'
