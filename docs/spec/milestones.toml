# Requirements per milestone of the implementation plan (CORE-78).
# Edited by hand: assign every new requirement to a milestone in the spec sync PR.
# status: not_started | in_progress | done.
# done_at: spec versions when the milestone was closed; requirements changed
#   later reopen the milestone in a spec-change issue (CORE-79).
# waive: requirement satisfied without code citing it (reason).
# waive_tests: requirement implemented but not testable by name (reason).
# Ranges use "..": "CORE-20..29" means CORE-20 to CORE-29.

[[milestone]]
number = 0
name = "Setup: repositories, CI, dependency management, traceability"
status = "done"
done_at = { core = "0.6", contract = "1.0 rev 6" }
requirements = ["CORE-70..79", "CORE-170..177"]
[milestone.waive]
"CORE-173" = "Renovate policy lives in renovate.json, which cannot carry comments"
"CORE-177" = "Architecture rule (one adapter per library), checked in review"
[milestone.waive_tests]
"CORE-70" = "Enforced by ruff pydocstyle rules in CI"
"CORE-72" = "CI gate configuration"
"CORE-170" = "Process requirement"
"CORE-171" = "CI step uv lock --check"
"CORE-172" = "Release workflow"
"CORE-174" = "CI job pip-audit"
"CORE-175" = "pytest configuration"
"CORE-176" = "Scheduled canary workflow"

