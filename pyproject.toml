# Implements CORE-280 (Core spec 0.17, §10.2 Packaging and deployment): the
# engine's catalogs are compiled into the wheel by mm3-build, like a module's.
[build-system]
requires = ["hatchling>=1.25", "mm3-build>=1.0,<2"]
build-backend = "hatchling.build"

[project]
name = "mm3-core"
description = "MM3 engine: a modular smart-mirror platform in Python (MagicMirror²-style)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "MM3 Project contributors" }]
keywords = ["smart-mirror", "magicmirror", "dashboard", "kiosk", "home-automation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dynamic = ["version"]
# Approved stack: core spec section 1.2. Ranges are bounded to the current
# major (CORE-171); exact versions live in uv.lock. Renovate raises the bounds.
# CalVer packages (structlog, argon2-cffi) are capped at the next year's major.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "ruamel.yaml>=0.18,<0.20",
    "watchfiles>=0.22,<2",
    "aiomqtt>=2.3,<3",
    "babel>=2.15,<3",
    "httpx>=0.27,<1",
    "httpcore>=1,<2",  # pools behind the one httpx client (CORE-282, CORE-285)
    "structlog>=24.1,<27",
    "jinja2>=3.1,<4",
    "argon2-cffi>=23.1,<26",
    "pyotp>=2.9,<3",
    "websockets>=13,<18",  # kiosk agent client only (core spec 1.2), via mm3.core.kiosk.agent
    "packaging>=24,<27",  # specifiers of mm3 module check (CORE-281)
    "mm3-build>=1.0,<2",  # catalog compiler of mm3 i18n compile/check (CORE-280)
]

[project.optional-dependencies]
migrate = ["esprima>=4.0,<5"]
# Implements CORE-279 (Core spec 0.17, §10.2 Packaging and deployment): the
# test kit and mm3 module check for module developers; never on mirrors.
testing = [
    "pytest>=8.2,<10",
    "pytest-asyncio>=1.0,<2",
    "playwright>=1.44,<2",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "playwright>=1.44",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]

[project.scripts]
mm3 = "mm3.cli.main:main"

[project.urls]
Homepage = "https://github.com/mm3-project/mm3-core"
Issues = "https://github.com/mm3-project/mm3-core/issues"
Changelog = "https://github.com/mm3-project/mm3-core/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/mm3/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mm3"]

[tool.hatch.build.targets.sdist]
exclude = ["/mm3-build"]  # its own distribution (CORE-280)

[tool.hatch.build.hooks.mm3-i18n]

# mm3-build lives in this repository (CORE-280); uv builds and installs it
# from the workspace, PyPI users get the released distribution.
[tool.uv.workspace]
members = ["mm3-build"]

[tool.uv.sources]
mm3-build = { workspace = true }

# --- quality -----------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "mm3-build/src", "tests", "tools"]
extend-exclude = ["docs/spec/*.md"]  # exported specs (CORE-75), not hand-formatted

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "D", "PT", "S"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
# Implements CORE-70 (Core spec 0.6, §10.3 Documentation and quality)
# Implements CORE-14 (Core spec 0.7, §4.4 Contract rules): Google-style
# docstrings on every public class and method (rule set "D" above).
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101"]
"tools/**" = ["T201"]
"src/mm3/core/modcheck/*scan.py" = ["SIM102"]  # rule tables read better flat

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src:mm3-build/src"
packages = ["mm3", "mm3_build"]

[[tool.mypy.overrides]]
module = ["hatchling.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Coverage is measured on the whole package; CORE-72 (>= 85 %) is enforced
# in [tool.coverage.report].
addopts = "--strict-markers --cov=mm3 --cov=mm3_build --cov-report=term-missing"
markers = ["browser: needs Chromium (Playwright); skipped when it cannot start"]
# Implements CORE-175 (Core spec 0.6, §10.9 Dependency management)
filterwarnings = ["error::DeprecationWarning", "error::PendingDeprecationWarning"]

[tool.coverage.report]
# Implements CORE-72 (Core spec 0.6, §10.3 Documentation and quality)
# CORE-72: >= 85 % line coverage (measured on the whole mm3 package).
fail_under = 85
