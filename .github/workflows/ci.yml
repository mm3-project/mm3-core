name: CI

# Implements CORE-170 (Core spec 0.6, §10.9 Dependency management)
# Implements CORE-72 (Core spec 0.6, §10.3 Documentation and quality)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # merge base for the stale-citation check (CORE-77)
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      # Implements CORE-171 (Core spec 0.6, §10.9 Dependency management)
      - name: Lockfile matches pyproject (CORE-171)
        run: uv lock --check
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # Implements CORE-41, CORE-42 (Core spec 0.15, §8.4 Quality gate)
      # Implements CORE-263 (Core spec 0.15, §8.5 Catalogs at run time)
      - name: Catalogs compiled and complete (CORE-41, CORE-42, CORE-263)
        run: uv run mm3 i18n check
      # Implements CORE-75, CORE-76 (Core spec 0.6, §10.3 Documentation and quality)
      - name: Spec sync up to date (CORE-75, CORE-76)
        run: uv run python tools/spec_sync.py --check
      # Implements CORE-74, CORE-77 (Core spec 0.6, §10.3 Documentation and quality)
      - name: Spec references (CORE-74, CORE-77)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            uv run python tools/check_spec_refs.py --base "origin/${{ github.base_ref }}"
          else
            uv run python tools/check_spec_refs.py
          fi
      # Implements CORE-78 (Core spec 0.6, §10.3 Documentation and quality)
      - name: Coverage matrix (CORE-78)
        run: uv run python tools/trace_report.py --out coverage.md && cat coverage.md >> "$GITHUB_STEP_SUMMARY"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --all-extras
      # Deprecation warnings fail the suite (CORE-175), see pyproject.toml.
      - run: uv run pytest

  # Implements CORE-174 (Core spec 0.6, §10.9 Dependency management)
  audit:
    name: pip-audit (CORE-174)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv export --frozen --all-extras --no-emit-project --format requirements-txt -o requirements.lock.txt
      # Every ignored advisory is listed in .pip-audit-ignore with its reason.
      - run: |
          args=$(awk '!/^#/ && NF {print "--ignore-vuln " $1}' .pip-audit-ignore)
          uvx pip-audit -r requirements.lock.txt --disable-pip --require-hashes --strict $args

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, audit]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
