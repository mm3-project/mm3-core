# Requirements per milestone of the implementation plan (CORE-78).
# Edited by hand: assign every new requirement to a milestone in the spec sync PR.
# status: not_started | in_progress | done.
# done_at: spec versions when the milestone was closed; requirements changed
#   later reopen the milestone in a spec-change issue (CORE-79).
# waive: requirement satisfied without code citing it (reason).
# waive_tests: requirement implemented but not testable by name (reason).
# Ranges use "..": "CORE-20..29" means CORE-20 to CORE-29.

