# Implements CORE-172 (Core spec 0.6, §10.9 Dependency management)
# Publishes to PyPI with Trusted Publishing (core spec 10.6, MOD-96) and
# attaches the tested constraints file to the GitHub release (CORE-172).
# One-time setup on PyPI: add a trusted publisher for project "mm3-core",
# owner "mm3-project", repository "mm3-core", workflow "release.yml",
# environment "pypi".
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv lock --check
      - run: uv build
      - name: Constraints file from the lock, with hashes
        run: uv export --frozen --no-dev --all-extras --no-emit-project --format requirements-txt -o dist-constraints.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: constraints
          path: dist-constraints.txt

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # Trusted Publishing + PEP 740 attestations
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  constraints:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: constraints
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv dist-constraints.txt "mm3-core-${{ github.event.release.tag_name }}-constraints.txt"
          gh release upload "${{ github.event.release.tag_name }}" mm3-core-*-constraints.txt --repo "${{ github.repository }}"
