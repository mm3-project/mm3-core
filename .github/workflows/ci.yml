name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Lockfile matches pyproject (CORE-171)
        run: uv lock --check
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Spec references (CORE-74)
        run: uv run python tools/check_spec_refs.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --all-extras
      # Deprecation warnings fail the suite (CORE-175), see pyproject.toml.
      - run: uv run pytest

  audit:
    name: pip-audit (CORE-174)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv export --frozen --all-extras --no-emit-project --format requirements-txt -o requirements.lock.txt
      # Every ignored advisory is listed in .pip-audit-ignore with its reason.
      - run: |
          args=$(awk '!/^#/ && NF {print "--ignore-vuln " $1}' .pip-audit-ignore)
          uvx pip-audit -r requirements.lock.txt --disable-pip --require-hashes --strict $args

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, audit]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
