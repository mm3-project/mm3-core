[[milestone]]
number = 2
name = "Configuration, layout, display, history, pages"
status = "done"
done_at = { core = "0.11", contract = "1.0 rev 7" }
# Split into four PRs: A config loading and check-config, B hot reload,
#   C layout, display and pages, D history. Core spec 0.11 changes
#   (CORE-153, 155, 201, 208, 216, 243: custom.css as a config section,
#   server.allow, no admin.token) were redone in issue #19.
# CORE-201: server.allow is applied live by the web gateway in milestone 3.
# CORE-244: only the backup block schema here; backups run in milestone 7.
# CORE-243: English messages live in mm3.core.config.records; the i18n
#   service (milestone 3) compiles them into the engine catalog.
# CORE-101: resending configs on a locale change comes with hot reload and
#   the shell; one form field per locale comes with the editor (milestone 6).
# CORE-209: GET /api/v1/status serves ConfigManager.status() in milestone 6.
# CORE-210: pushing layout and display changes to browsers plugs into
#   ConfigManager.layout_listeners with the shell (milestone 3).
# CORE-150: editor-level undo and redo (CORE-151, CORE-152) and the history
#   view with "Open in editor" come with the admin (milestone 6).
# CORE-94: the "rescale proportionally" action comes with the layout editor
#   (milestone 6); here out-of-bounds positions fail validation.
# CORE-142, CORE-212: the shell renders the grid and stacks (milestone 3); the
#   admin shows pixel sizes and the preview uses the viewport (milestone 6).
# MOD-67: mm3 module check flags a missing HEADER key (milestone 4).
requirements = [
  "CORE-02", "CORE-30..33", "CORE-90..94", "CORE-96", "CORE-101",
  "CORE-140..142", "CORE-150", "CORE-153..156", "CORE-200..219",
  "CORE-230..232", "CORE-243..245", "MOD-45..50", "MOD-67",
]

