[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mm3-core"
description = "MM3 engine: a modular smart-mirror platform in Python (MagicMirror²-style)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "MM3 Project contributors" }]
keywords = ["smart-mirror", "magicmirror", "dashboard", "kiosk", "home-automation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dynamic = ["version"]
# Approved stack: core spec section 1.2. Ranges are bounded to the current
# major (CORE-171); exact versions live in uv.lock. Renovate raises the bounds.
# CalVer packages (structlog, argon2-cffi) are capped at the next year's major.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "ruamel.yaml>=0.18,<0.20",
    "watchfiles>=0.22,<2",
    "aiomqtt>=2.3,<3",
    "babel>=2.15,<3",
    "httpx>=0.27,<1",
    "structlog>=24.1,<27",
    "jinja2>=3.1,<4",
    "argon2-cffi>=23.1,<26",
    "pyotp>=2.9,<3",
]

[project.optional-dependencies]
migrate = ["esprima>=4.0,<5"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "playwright>=1.44",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]

[project.scripts]
mm3 = "mm3.cli.main:main"

[project.urls]
Homepage = "https://github.com/mm3-project/mm3-core"
Issues = "https://github.com/mm3-project/mm3-core/issues"
Changelog = "https://github.com/mm3-project/mm3-core/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/mm3/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mm3"]

# --- quality -----------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "D", "PT", "S"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101"]
"tools/**" = ["T201"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["mm3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Coverage is measured on the whole package; CORE-72 (>= 85 % on mm3.core)
# is enforced per package once mm3.core has code.
addopts = "--strict-markers --cov=mm3 --cov-report=term-missing"
# CORE-175: deprecations from dependencies fail the suite.
filterwarnings = ["error::DeprecationWarning", "error::PendingDeprecationWarning"]

[tool.coverage.report]
# CORE-72: >= 85 % line coverage on mm3.core. Enforced once mm3.core has code.
fail_under = 0
